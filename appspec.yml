version: 0.0
os: linux

files:
  - source: /
    destination: /opt/monu
    overwrite: true

permissions:
  - object: /opt/monu
    pattern: "**"
    owner: monu
    group: monu
    mode: 755
    type:
      - file
      - directory

hooks:
  ApplicationStop:
    - location: scripts/deploy/stop_application.sh
      timeout: 60
      runas: root
  BeforeInstall:
    - location: scripts/deploy/before_install.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/deploy/install_service.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: scripts/deploy/start_application.sh
      timeout: 120
      runas: root
  ValidateService:
    - location: scripts/deploy/validate_service.sh
      timeout: 90
      runas: root
