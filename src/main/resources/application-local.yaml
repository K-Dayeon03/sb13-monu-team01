spring:
  datasource:
    # local 프로필은 별도 PostgreSQL 설치 없이 바로 실행할 수 있도록 H2 메모리 DB를 기본으로 사용합니다.
    # PostgreSQL로 테스트하려면 DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER_CLASS_NAME,
    # DB_SCHEMA_PLATFORM=postgresql 환경변수를 함께 지정하면 됩니다.

#    url: ${DB_URL:jdbc:h2:mem:monu;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
#    username: ${DB_USERNAME:sa}
#    password: ${DB_PASSWORD:}
#    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.h2.Driver}

    # local 프로필은 PostgreSQL로 애플리케이션을 띄워 백업 배치를 직접 테스트할 때 사용합니다.
    # 필요하면 실행 시 DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD 환경변수로 값을 바꿀 수 있습니다.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:monu}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # 로컬 테스트 편의를 위해 엔티티 기준으로 테이블을 자동 반영합니다.
      # 운영 환경에서는 validate 또는 마이그레이션 도구 사용을 권장합니다.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  batch:
    job:
      # Job은 서버 시작 시 자동 실행하지 않고, /api/batch/backup 같은 수동 API나 스케줄러가 실행합니다.
      enabled: false

  sql:
    init:
      # Spring Boot 4.1에서는 spring.batch.jdbc.initialize-schema가 설정 메타데이터에 없습니다.
      # 그래서 사용하는 DB에 맞는 Spring Batch schema SQL을 직접 실행합니다.
      mode: always
      schema-locations: classpath:org/springframework/batch/core/schema-${DB_SCHEMA_PLATFORM:h2}.sql
      # 로컬 DB나 PostgreSQL에 이미 BATCH_* 테이블이 만들어져 있어도 서버가 뜨도록 중복 생성 오류는 넘깁니다.
      continue-on-error: true

batch:
  enabled: true
  scheduler:
    # 수동 테스트 중에는 스케줄러가 자동으로 돌지 않게 꺼둡니다.
    enabled: false

article:
  backup:
    storage: local

log:
  archive:
    # 로컬에서는 S3 대신 build/log-archives 아래로 복사해서 적재 흐름만 확인합니다.
    storage: local
    source-dir: ${LOG_ARCHIVE_SOURCE_DIR:logs}
    local-destination-dir: ${LOG_ARCHIVE_LOCAL_DESTINATION_DIR:build/log-archives}
    s3-prefix: ${LOG_ARCHIVE_S3_PREFIX:logs}
    cron: ${LOG_ARCHIVE_CRON:0 30 2 * * *}
    zone: ${LOG_ARCHIVE_ZONE:Asia/Seoul}
    manual-enabled: true

naver:
  api:
    # 백업 배치만 테스트할 때는 실제 Naver API 키가 필요 없어서 기본 테스트 값을 둡니다.
    client-id: ${NAVER_CLIENT_ID:test-client-id}
    client-secret: ${NAVER_CLIENT_SECRET:test-client-secret}
